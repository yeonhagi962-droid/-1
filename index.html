const HELP=`<h4>화면 조작</h4><ul><li>두 손가락으로 확대·축소, 빈 곳을 끌어 이동합니다.</li><li>오른쪽 위 버튼: 전체 / 제어 / 전원으로 보는 구역을 바로 바꿉니다.</li><li>폰은 가로로 돌리면 더 크게 보입니다.</li></ul><h4>실행 모드</h4><ul><li>버튼(PB)을 누르고(터치 유지) 있으면 동작합니다.</li><li>EOCR·THR 접점을 탭하면 과전류 트립/복귀가 됩니다.</li><li>리미트 스위치(LS)는 탭할 때마다 작동/해제가 바뀝니다.</li><li>셀렉트 스위치(SS)는 탭하면 M↔A 위치가 바뀌고, 라벨이 같은 m(b접점)·a(a접점)가 함께 움직입니다. 처음에는 M 위치(m 닫힘, a 열림)입니다.</li><li>수위센서(탱크)를 탭하면 수위가 상한→중간→하한→중간→상한 순으로 바뀝니다.</li><li>플로트레스(FL)는 수위가 상한에 닿으면 a접점이 동작(닫힘)하고, 하한에 닿으면 a접점이 복귀하면서 b접점이 동작합니다. 중간 수위에서는 직전 상태를 유지합니다. 센서가 없으면 FL 부품을 직접 탭해 수위를 바꿉니다.</li><li>부저(BZ)는 켜지면 소리가 나며, 오른쪽 위 🔊 버튼으로 끌 수 있습니다.</li><li>MCCB를 탭하면 ON/OFF, 끊어진 퓨즈를 탭하면 교체됩니다.</li></ul><h4>편집 모드</h4><ul><li>부품을 끌어 이동합니다 (터치 가능).</li><li>접점·기기 버튼을 누르면 라벨 목록이 뜨고, 라벨을 고르면 설치됩니다(닫으면 설치 취소). 설치한 부품을 더블클릭(더블탭)하면 라벨 목록이 다시 뜹니다.</li><li>C 키를 누른 채(또는 [다중연결] 버튼을 켜고) 단자를 여러 개 고른 뒤 C 키를 떼면(또는 버튼을 다시 누르면) 선택한 단자가 모두 연결됩니다.</li><li>단자(○)를 차례로 탭해 배선하고, 퓨즈 출력 단자(P1, P2)를 탭해 제어회로 전원과 연결합니다.</li><li>선을 누르면 삭제됩니다.</li><li>부품의 이름(라벨)을 누르거나 선택된 부품을 다시 탭하면 라벨 목록이 열립니다.</li><li>부품 선택 후 회전(R키) / 삭제를 할 수 있습니다.</li><li>타이머·플리커 시간은 부품을 선택하고 '시간 입력' 버튼을 눌러 초 단위로 직접 입력합니다(0.1~3600초, 소수 가능).</li></ul><h4>전원부</h4><ul><li>TB1·MCCB·EOCR·MC·모터는 왼쪽에 고정되어 있습니다.</li><li>위쪽의 '도면·정역·Y-Δ' 버튼으로 전원부 결선을 바꿀 수 있습니다.</li><li>제어회로 배선은 퓨즈 출력 단자 P1·P2에서 시작합니다.</li></ul><h4>참고</h4><ul><li>학습용 단순 논리 시뮬레이션이므로 실제 도면은 공단 공개문제와 대조하세요.</li></ul>`;
